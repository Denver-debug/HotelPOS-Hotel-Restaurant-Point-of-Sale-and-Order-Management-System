# Nginx reverse proxy for HotelPOS (docs/DEPLOY-AWS.md, step 9).
# Install: sudo cp deploy/nginx-hotelpos.conf /etc/nginx/sites-available/hotelpos
#          sudo ln -s /etc/nginx/sites-available/hotelpos /etc/nginx/sites-enabled/
# Replace pos.example.com with your domain (or _ to answer on the bare IP).
# certbot --nginx (step 10) adds the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    # Product images are limited to 2 MB by the app; leave room for the form fields.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
